# Drip-feed publishing: programmatic pages in src/data/publish-schedule.json go live
# on their scheduled date. This workflow triggers a fresh build every morning.
#
# Setup (once): in your host (Vercel / Netlify / Cloudflare Pages) create a "Deploy hook"
# URL for the main branch, then add it to GitHub → Settings → Secrets → Actions as DEPLOY_HOOK_URL.
name: Daily rebuild

on:
  schedule:
    - cron: '15 5 * * *' # 05:15 UTC every day
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then echo "DEPLOY_HOOK_URL secret not set"; exit 1; fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL"
